chat-format: '<hover:show_text:''<gray>Informations:<newline><color:#55efc4>Argent: <white>%vault_eco_balance_2dp%$<newline><color:#55efc4>Guilde: <white>%guilds_name%<newline><newline><gray>Clic pour envoyer un message''><click:suggest_command:''/msg %player% ''><gray>[%levels_level%]</gray> <color:#feca57>%premium%</color>%vault_suffix%%vault_prefix% %player% %vault_suffix% ➤ <reset>'


staff-chat-format: '<dark_gray>[<dark_aqua><b>Staff</b><dark_gray>] <b>%vault_suffix%%vault_prefix% %player% %vault_suffix% ➤ '

# Format du ping lorsqu'un joueur est mentionné dans le chat - MiniMessage
# Placeholder: <player> (le pseudo mentionné)
ping-format: '<color:#fdcb6e>@<player>'

# Format de l'item partagé dans le chat via [i] / [item] - MiniMessage
# Placeholder: %item% (le nom de l'item). Le survol natif (hover) est réappliqué sur l'ensemble.
item-format: "[%item%]"

# Format des annonces joueurs (/annonce) - MiniMessage
# Placeholders: <player> (nom du joueur), <message> (contenu de l'annonce)
announce-format: "<color:#f07e71><bold>Annonce de <color:#fbb29e><player></bold></color> <color:#f07e71>➤ <color:#7bc8fe><bold><message>"
# Format pour les joueurs ayant la permission "premium"
announce-premium-format: "<color:#FFD700>★ <color:#f07e71><bold>Annonce de <color:#fbb29e><player></bold></color> <color:#f07e71>➤ <color:#7bc8fe><bold><message>"

# Messages des commandes /site, /vote, /discord, /grades, /wiki - MiniMessage
messages:
    site: "<gray>Notre site : <aqua><click:open_url:'https://example.com'>https://example.com</click>"
    vote: "<gray>Votez ici : <aqua><click:open_url:'https://example.com/vote'>https://example.com/vote</click>"
    discord: "<gray>Rejoignez le Discord : <aqua><click:open_url:'https://discord.gg/example'>https://discord.gg/example</click>"
    grades: "<gray>Infos sur les grades : <aqua><click:open_url:'https://example.com/grades'>https://example.com/grades</click>"
    wiki: "<gray>Le wiki : <aqua><click:open_url:'https://example.com/wiki'>https://example.com/wiki</click>"

announces:
    interval: 300
    messages:
        0:
            message: "<color:#FF55FF>≫ <color:#FF55FF>Rejoignez-nous sur discord pour suivre toute l'actualité du serveur ! <click:run_command:/discord><hover:show_text:'Cliquez pour ouvrir Discord'><color:#FF55FF><bold>/discord</bold></hover></click> !"
        1:
            message: "<color:#FF55FF>≫ <color:#FF55FF>Pensez à voter régulièrement pour soutenir le serveur et gagner des récompenses ! <click:run_command:/vote><hover:show_text:'Cliquez pour voter'><color:#FF55FF><bold>/vote</bold></hover></click> !"
        2:
            message: "<color:#FF55FF>≫ <color:#FF55FF>Pensez à visiter notre site. Vous y trouverez le réglement, la boutique, la page de votes,...! <click:run_command:/site><hover:show_text:'Cliquez pour ouvrir le site'><color:#FF55FF><bold>/site</bold></hover></click> !"
        3:
            message: "<color:#FF55FF>≫ <color:#FF55FF>Vous pouvez nous aider à financer le serveur en faisant des achats sur la boutique ! <click:run_command:/boutique><hover:show_text:'Cliquez pour ouvrir la boutique'><color:#FF55FF><bold>/boutique</bold></hover></click> !"